<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour Madame!</title>
  
  <!-- Import handwritten font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-day">
  <!-- Canvas Overlay for Ambient Particles & Burst Physics -->
  <canvas id="ambient-particles"></canvas>

  <!-- Top Right Customization Folder Button & Modal -->
  <div id="customization-folder-container">
    <button id="folder-toggle-btn" title="Change Color">
      <span class="folder-icon">🎨</span>
    </button>
    
    <!-- Android-Style Apps Folder Modal with Extended Quick Links -->
    <div id="apps-folder-modal" class="apps-folder-hidden">
      <div class="folder-header">
        <h3>Feature Customizer</h3>
        <button id="folder-close-btn">&times;</button>
      </div>
      <div class="apps-grid">
        <button class="feature-app-btn" data-feature="1">Feature 1</button>
        <button class="feature-app-btn" data-feature="2">Feature 2</button>
        <button class="feature-app-btn" data-feature="3">Feature 3</button>
        <button class="feature-app-btn" data-feature="4">Feature 4</button>
        <button class="feature-app-btn" data-feature="5">Feature 5</button>
        <button class="feature-app-btn" data-feature="6">Feature 6</button>
        <button class="feature-app-btn" data-feature="7">Feature 7</button>
        <button class="feature-app-btn" data-feature="8">Feature 8</button>
        <button class="feature-app-btn" data-feature="9">Feature 9</button>
        <button class="feature-app-btn" data-feature="10">Feature 10</button>
        <button class="feature-app-btn" data-feature="11">Feature 11</button>
        <button class="feature-app-btn" data-feature="12">Feature 12</button>
      </div>

      <div class="folder-divider"></div>
      <div class="folder-section-title">Quick Links</div>
      
      <!-- 3 x 3 Links Grid (Pill-Shaped Buttons) -->
      <div class="links-grid">
        <a href="https://outlook.cloud.microsoft/mail/" target="_blank" rel="noopener noreferrer" class="link-app-btn">
          <span class="link-emoji">📧</span> Outlook
        </a>
        <a href="http://canvas.vub.be/login/microsoft" target="_blank" rel="noopener noreferrer" class="link-app-btn">
          <span class="link-emoji">📚</span> Canvas
        </a>
        <a href="https://cloud.timeedit.net/be_vub/web/student/ri1Yg776W17Z2YQ29678641950505631XX8XyY7QZ87Q616505Y00gZuQnw.html" target="_blank" rel="noopener noreferrer" class="link-app-btn">
          <span class="link-emoji">📅</span> Schedule
        </a>
        <a href="https://gemini.google.com/app" target="_blank" rel="noopener noreferrer" class="link-app-btn">
          <span class="link-emoji">✨</span> Gemini
        </a>
        <a href="https://web.whatsapp.com/" target="_blank" rel="noopener noreferrer" class="link-app-btn">
          <span class="link-emoji">💬</span> WhatsApp
        </a>
        <a href="https://console.pearson.com/console/home" target="_blank" rel="noopener noreferrer" class="link-app-btn">
          <span class="link-emoji">📖</span> Pearson
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="link-app-btn coming-soon">
          <span class="link-emoji">⏳</span> Coming Soon
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="link-app-btn coming-soon">
          <span class="link-emoji">⏳</span> Coming Soon
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="link-app-btn coming-soon">
          <span class="link-emoji">⏳</span> Coming Soon
        </a>
      </div>
    </div>
  </div>

  <!-- Weather Bubble (V 1.8.1) -->
  <div id="weather-bubble">
    <div id="weather-float">
      <div id="weather-blob">
        <div id="weather-content">Loading weather...</div>
      </div>
      <!-- Sassy bubble container -->
      <div id="angry-bubble" class="angry-bubble"></div>
    </div>
  </div>

  <!-- Google Search Bubble (V 1.8.1) -->
  <div id="search-bubble">
    <div id="search-blob">
      <div class="google-logo">
        <span style="color: #4285F4;">G</span><span style="color: #EA4335;">o</span><span style="color: #FBBC05;">o</span><span style="color: #4285F4;">g</span><span style="color: #34A853;">l</span><span style="color: #EA4335;">e</span>
      </div>
      <form id="search-form" action="https://www.google.com/search" method="GET" target="_blank">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" name="q" placeholder="Search Google or type a URL" autocomplete="off" required>
        </div>
      </form>
    </div>
  </div>

  <!-- Grass background layer -->
  <div id="grass-container"></div>
  
  <!-- The garden where flowers will grow dynamically -->
  <div id="garden"></div>
  
<script src="script.js"></script>
<script src="telemetry0.js"></script>
</body>
</html>
