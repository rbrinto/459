<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salut! ❤️</title>
  
  <!-- Import handwritten font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Weather Bubble (V 1.6 - Organic & Interactive) -->
  <div id="weather-bubble">
    <div id="weather-float">
      <!-- The new blob container that takes the punch effect -->
      <div id="weather-blob">
        <div id="weather-content">Loading weather...</div>
      </div>
    </div>
  </div>

  <!-- Grass background layer -->
  <div id="grass-container"></div>
  
  <!-- The garden where flowers will grow dynamically -->
  <div id="garden"></div>
  
  <script src="script.js"></script>
</body>
</html>
